*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:26px 64px}

.tabs{display:flex;gap:2px;margin:18px 0 0;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.tab{border:0;background:none;font-family:var(--sans);font-size:13px;font-weight:600;color:var(--muted);
 padding:8px 13px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}

.btn.ghost{background:transparent;color:var(--accent)}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

 gap:14px;align-items:center;cursor:pointer;width:100%;text-align:left;font-family:var(--sans);color:var(--ink);margin-bottom:10px}
.epcard:hover{border-color:var(--accent)}
.epcard .t{font-size:16px;font-weight:600;flex:1;min-width:0}

.pill{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;padding:2.5px 8px;
 border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.w{background:var(--warn-soft);color:var(--warn)}
.back{border:0;background:none;color:var(--accent);font-family:var(--sans);font-size:13px;cursor:pointer;padding:6px 0}

.opts{display:flex;gap:4px;flex-wrap:wrap}

.opt[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
textarea,input[type=text]{width:100%;border:1px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink);

.script{background:var(--card);border:1px solid var(--rule);border-radius:8px;margin-top:12px;overflow:hidden}
.para{display:grid;grid-template-columns:76px 1fr;gap:0 16px;padding:13px 16px;border-bottom:1px solid var(--rule)}
.para:last-child{border-bottom:0}
.para .meta{font-family:var(--mono);font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;padding-top:4px}
.para .meta b{display:block;color:var(--muted);font-weight:500}
.para p{margin:0;font-family:var(--serif);font-size:16.5px;line-height:1.62;max-width:66ch}
.para.long{background:var(--warn-soft)}.para.long .meta b{color:var(--warn)}
.flag{display:inline-block;font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--warn);margin-top:4px}

.spec dt{color:var(--faint)}.spec dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums;word-break:break-all}
video{width:100%;border-radius:6px;background:#000;display:block;margin-bottom:12px}

.bg .nm{font-weight:600;display:flex;justify-content:space-between;gap:8px;align-items:baseline}

 font-family:var(--sans);font-size:13px;padding:7px 9px}
.tog{border:1px solid var(--rule);background:transparent;color:var(--muted);border-radius:6px;padding:5px 9px;
 font-size:12px;font-family:var(--sans);cursor:pointer;margin-top:auto;text-align:left}

.pk{margin-top:12px}

.pkbox{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:10px 12px;font-family:var(--serif);
 font-size:15px;line-height:1.6;white-space:pre-wrap}

<script id="data" type="application/json">{"channel":"ORDINARY MYTHS","episodes":[{"id":"orpheus","title":"Orpheus and Eurydice","status":"rendered","voice":"af_bella","persona":"Cleo","script":"orpheus","master":{"file":"/Users/natalia/YouTube/myth-test/out/myth-test.mp4","w":1920,"h":1080,"dur":559.83,"size":205266816,"state":"ready","preview":"proxy.mp4","downloads":[{"label":"Small","note":"480\u00d7270","src":"small.mp4","size":7580322},{"label":"Medium","note":"640\u00d7360","src":"proxy.mp4","size":14358941}]},"locations":["reflect","cold","night","under","climb","descent","grove","throne","dawn","dusk","light"]}],"scripts":[{"name":"orpheus","words":1490,"paras":[{"w":32,"t":"There is a story the Greeks told about a man who could sing so well that the world stopped to listen. Not as a figure of speech. The story means it literally."},{"w":63,"t":"His name was Orpheus. His mother was one of the Muses, which in that world is less a family tree than an explanation. When he sang, rivers slowed in their beds to hear the end of the verse. Trees pulled their roots up out of the ground and walked closer. Stones, which have no ears and no opinions, are said to have wept."},{"w":18,"t":"This is the part of the myth everybody remembers. It is not the part the myth is about."},{"w":60,"t":"Orpheus married a woman named Eurydice. The stories give her very little. She has no speeches, no arguments, almost no description. She exists, in most tellings, in order to be lost. That is worth noticing before we go on, because it tells you what the story thinks it is doing, and what it is actually doing are two different things."},{"w":36,"t":"On their wedding day, Eurydice walked in the long grass by the river. She stepped on a snake. The snake did what snakes do. And by evening the greatest musician in the world was a widower."},{"w":60,"t":"Now. Grief does something particular to people, and the Greeks understood this better than we usually give them credit for. Grief makes you certain that there is a thing you could have done. That if you were only clever enough, or fast enough, or good enough at the one thing you happen to be good at, you could undo it."},{"w":7,"t":"Orpheus was very good at one thing."},{"w":4,"t":"So he went down."},{"w":71,"t":"Not metaphorically. He walked to a cave mouth in the south and went down into the country of the dead, carrying nothing but a lyre, which is the single most absurd and most human act in all of Greek myth. He did not bring a sword. He did not bring an army. He brought the thing he was best at, because when you are drowning you reach for what you know."},{"w":9,"t":"And here the story does something strange. It works."},{"w":99,"t":"He sang to the ferryman, and the ferryman carried him across without payment. He sang to the dog with three heads, and the dog lay down. He sang to the dead themselves, the shades who feel nothing and want nothing, and the dead stopped what they were doing and stood still. The stories say that the wheel of one tormented king paused in its turning. The vulture lifted its head from its work. For the length of one song, the whole machinery of punishment in the underworld simply stopped, because someone had made something beautiful enough to interrupt it."},{"w":7,"t":"And then he came to the throne."},{"w":40,"t":"Hades and Persephone heard him out. And Persephone, who knows something about being taken below against her will, wept. And they gave him what nobody is ever given. They said yes. Eurydice would follow him back up into the light."},{"w":16,"t":"One condition. He must not look back at her until they had both reached the sun."},{"w":34,"t":"You already know how this ends. Everyone knows how this ends. And yet the story is told and told again, which means the ending is not the point either. The point is the walk."},{"w":71,"t":"Picture it. A long climb in the dark, upward, for hours. And behind him, no sound. The dead do not breathe. They do not scuff the gravel. He cannot hear her, and he has no way to know whether she is there or whether he is climbing alone out of hell for nothing, having been made a fool of by gods who are famous, above all, for making fools of people."},{"w":24,"t":"So for hours he walks with a question he cannot answer and cannot stop asking. Is she there. Is she there. Is she there."},{"w":16,"t":"And at the very last moment, with the daylight on his own face, he turns around."},{"w":38,"t":"She is there. That is the cruelty of it. She was there the whole time. He sees her for a moment, and she is pulled backwards, and this time it is permanent, and it is his own doing."},{"w":6,"t":"Now. What is this story for."},{"w":63,"t":"The easy reading is that it is a story about obedience. The gods set a rule, the man broke the rule, the man was punished. Plenty of myths run on that engine. But this one does not quite fit, because the rule is a strange one. Why that rule? Not \"do not speak to her\", not \"do not touch her\". Do not look."},{"w":21,"t":"Here is a better reading. The condition is not a test he failed. The condition is a description of something true."},{"w":59,"t":"Orpheus could get almost all the way. He could charm death itself into a concession. What he could not do was walk in the dark and trust that what he had lost was behind him. He needed to see it. He needed proof. And the need for proof is exactly what destroyed the thing he was trying to save."},{"w":57,"t":"Anyone who has lost someone knows this walk. You are told the grief will ease. And you keep turning around to check whether it has, and every time you turn around you are back at the start, looking at the thing you lost, watching it recede again. The looking is the mechanism. Not the punishment for it."},{"w":30,"t":"Now I want to come back to Eurydice, because I said at the start that the story gives her nothing, and I want to be honest about what that means."},{"w":106,"t":"In almost every version, she does not speak. She is bitten, she is mourned, she is fetched, she is lost. She is the reason for the journey and she is never once asked whether she wanted to be on it. A poet two thousand years later noticed this and wrote her differently. In his version she has been dead long enough to have become something else. She is full of her own death the way a fruit is full of its own sweetness. And when the messenger god turns to her and says, he has looked back, she does not understand the sentence. She says, who."},{"w":66,"t":"That is a devastating idea and it is worth sitting with. That the person you are climbing out of hell to recover may not be waiting to be recovered. That they may have already gone somewhere you cannot follow, and that your love, which feels enormous and urgent and like the most important fact in the world, may simply not be addressed to anyone any more."},{"w":38,"t":"Both readings are in the myth. Orpheus turning around and losing her. Eurydice already gone before he turned. The Greeks were comfortable holding two incompatible things at once, which is something we have largely lost the knack of."},{"w":11,"t":"There is one more piece, and most tellings leave it out."},{"w":51,"t":"Orpheus went home. He did not stop singing. He sang for years, and the stories say he never took another lover, and that his music after the underworld was better than it had ever been before, which is a very dark thing to say about art and is almost certainly true."},{"w":69,"t":"And eventually he was torn apart by a crowd who did not like the way he lived. His head, still singing, was thrown into the river. And the river carried the head out to sea, and it was still singing when it reached the island, and they buried it there, and the nightingales over that grave are said to sing more sweetly than nightingales anywhere else in the world."},{"w":11,"t":"So. He did not get her back. He got the song."},{"w":62,"t":"That is not a consolation prize, and the Greeks were not offering it as one. They were making a harder claim. That the thing which makes you able to walk into hell is the same thing that makes you unable to leave it behind. That the gift and the wound are not two objects. They are one object, seen from two sides."},{"w":38,"t":"Three thousand years later we are still telling it. Every story about a man who goes into the dark to bring someone back is this story. Every story about looking back at the wrong moment is this story."},{"w":25,"t":"The Greeks did not think their myths were history. They thought they were instruments. Something you carry with you and use when the situation arises."},{"w":10,"t":"And the situation does arise. It arises for everybody, eventually."},{"w":30,"t":"So here is the instrument, handed over. There will be a climb, and it will be dark, and you will not be able to hear whether anything is following you."},{"w":13,"t":"The story is not telling you that you will manage not to look."},{"w":19,"t":"It is telling you that Orpheus did not manage it either. And that he was the best of them."}]}],"backgrounds":[{"id":"reflect","shots":21,"secs":104,"img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBUODAsLDBkSEw8VHhsgHx4bHR0hJTApISMtJB0dKjkqLTEzNjY2ICg7Pzo0PjA1NjP/2wBDAQkJCQwLDBgODhgzIh0iMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzP/wAARCADwAaQDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwDw9UU9hUixgdDUa/WrEYJrFmySJ x+3j2PqPzQehz+tRuFYchfyr5g/4THxIOf7c1D/v+3+NL/wmXiX/AKDuof8Af9v8aPqku4e3j2Ppos6D5XYezDIoa5dRhoyR6rXzL/wmXiX/AKDuof8AgQ3+NH/CY+Jf+g7qH/f9v8aPqku4e3j2Ppg3kYGWkVfZmx/OmvdwsOXgb/gQr5kl8U69Ou2XWL2QejTE0g8T66OmrXY/7amj6pLuHt49j6Va5g/hmVMejjFUbz7HcHdOlpOexLbGH4188/8ACVa//wBBe8/7+mj/AISrX/8AoMXv/f5qPqku4/rEex7Lf6Dot4Cq3c9o2ePnEi5rmdQ8A3WN1nqdtcKegb5Cf6V5/wD8JRr3/QYvf+/zVH/wkOs79/8Aat5u9fOb/GtI0akepEqsH0Oml8Ia7HIVNk7Y7qQR+hornP8AhJ9e/wCgxff9/wBv8aK05andEc0DKooorcyCiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooA//2Q==","last":331}],"wpm":150,"package":{"titles":["The Man Who Bargained With Death","The Fatal Mistake That Traps You in the Past","The Dark Source of All Beautiful Music","Why You Can Never Look Back","The Terrible Price of Genius","A Journey Everyone Takes Alone"],"hooks":["The Greeks told a story about a musician so good, the world literally stopped to listen. When he sang, stones wept and trees pulled up their roots to walk closer. But this isn't a story about his talent. It's about the one thing his music couldn't fix.","On his wedding day, his wife was killed by a snake. Grief makes you believe that if you were just good enough at your one skill, you could undo death itself. So he took his guitar and went to get her back. From hell.","Imagine walking into the land of the dead armed only with a song. No sword, no army, just a lyre. He sang to the three-headed dog, he sang to the tortured souls, and the entire machinery of punishment stopped just to listen.","The gods of the dead gave him a deal nobody ever gets. He could have her back, but on one condition: he couldn't look back at her until they were both in the sunlight. You already know how this ends. But the reason why is the part we always miss.","He walks for hours in the dark, unable to hear his wife behind him. The dead make no sound. The doubt eats at him: is she there? Is this a trick? At the last second, with the sun on his face, he turns. He had to know for sure.","We always focus on the man who went to hell to rescue his wife. But what about her? One poet reimagined the story from her perspective. When told 'he looked back,' she is confused. She simply asks, 'Who?' and the whole story breaks apart.","He failed to bring her back. But his music, forged by that second loss, became more beautiful and heartbreaking than ever before. He didn't get the person back. He got the song. The story asks us if that's a fair trade.","The condition the gods gave him wasn't a test he failed. It was a description of something true about the world. The need for proof is often the very thing that destroys what you're trying to save. His need to see her is what made her disappear.","The most surprising part of the myth is that his ridiculous plan works. He charms the ferryman, the guard dog, even the god of death himself. They agree to let her go. He won. And then, in a single moment, he lost it all again, forever.","Anyone who has ever lost someone knows this walk. You're told things will get better, but you keep turning around to check if they have. And every time you look back, you're at the beginning again, watching them disappear. The looking is the trap."],"thumbText":"DON'T LOOK BACK","description":"There is a story about a man whose music was so powerful it could halt rivers, move trees, and even pause the punishments of hell. His name was Orpheus, and when he lost his wife Eurydice on their wedding day, he decided to do the impossible: walk into the land of the dead and bring her back.\n\nThe most amazing part of the story is that his plan works. He charms his way past every guardian and persuades the gods of the underworld to release his wife. They agree, but with one simple, impossible condition: he must walk ahead of her and not look back until they both stand in the sun.\n\nEveryone knows how the story ends. But the failure of Orpheus is not a simple story of disobedience. It's a profound exploration of grief, trust, and the self-destructive nature of doubt. It\u2019s about the walk we all take when trying to move on from loss, and the way our need for certainty can trap us in the very past we're trying to escape.\n\nThe myth of Orpheus and Eurydice is not just about a tragic hero. It's about what art is for, where it comes from, and the terrible price that is sometimes paid for the most beautiful songs.\n\nChapters:\n0:00 The Singer the World Stopped For\n1:04 A Wedding and a Funeral\n2:11 The Descent\n3:48 The Impossible Bargain\n4:55 The Long Walk Out\n6:01 The Fatal Mistake\n7:15 A Crueler Reading\n8:40 He Got The Song","tags":["Mythology","History","Psychology","Philosophy","Greek Mythology","Storytelling","Grief","Art","Orpheus","Underworld","Ancient Greece","Hades"],"built":"2026-09-18 13:35","model":"gemini-2.5-pro"},"cleo":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAeQAAANiCAYAAACw2LoVAAEAAElEQVR42uz9d7xt2VUdCI+59j7h5vByvVRRlaVKkhAC1ZURGEywG9sYHBpMjp/5PoNxu9u8V58Tbvxru7uxTWrabrDJwQaMQcB7BQJJKFRQKEmlqheqXr10870n7r3W7D/WDmutvfY5596qkgSs+X636oYT9tn7nDXWnHPMMYAQIUKE+HMe99zzfSvhLIT4bAeFUxAiRIg/nyD8D84CADOfAYCFGXriTz78v54NZyZEAOQQIUKE+AyAMDM/DsDKiJkZAPD59zSf+A//9Z8HUA4RADlEiBAhXs+yNDOd8wFxHkIQvuuvLpz/0q/9q0/c9eC958NZC/GZDBFOQYgQIf48BDOdMYHYBWMAUIrxM7+1tbJx8+aZcMZCBEAOESJEiNenX7wyyW3XdxV+7P/8rZULz71wNpy5EAGQQ4QIEeI1LVXzmdHZM5dZMwPv+dgQ5/7Lb4QsOUQA5BAhQoTA61CqdvvGZumaufxZKsaP/fxLeO9v/nrIkkMEQA4RIkSI17JUzR4Slw3KDCIqvtZ3GT/5k+8JWXKIAMghQoQI8ZqWqh0wZmbkv8lB2PyehMB7Pp7i3/7gPwtZcogAyCFChAiB14hV7S1bM1eBmAhCCLRbLczOzuM//vrmmQ+8+1wA5RAIc8ghQoQI8SpmjkeWqYlABhgvLy+j2Wxianoazek2RDNGb2Mbx6dewk/96g+F9TJEyJBDhAgRYo9L28ooRrWZkRARQITZuTkcPn4MS/efQPuuA4hOz4BONzH9lmXc4NvwY//kh0OWHOJ1jTicghAhQuDPXLmaHx8FxmyUqgGgEcc4cuQIcHQa6rY2xBwBLCEaEjSlgCNT+PU/7J8BEEA5xOsWUTgFIUKEwJ855yY6O6pc7Zaqjx49ipnjy+ATbYhbYkS3RbjjjRJveVuKB9/EuO+xGIe+oI17orfT+//od86HsxwiAHKIECFCjImDBz//VoC+YdRtClY1ERYXFnDoliNQJ6aB402IoxG+9At2cfJQikYMKAV8+HngUy8pvPPvLq7Mv/ImevrD5wIoh0DoIYcIESIEJh <script>
(function(){
var D=JSON.parse(document.getElementById('data').textContent);
var WPM=D.wpm,DB=null,DL=null,store={tone:{},bg:{},pack:{},queue:[],jobs:{},watch:{},dirty:{}},open=null;
var SEEDS=["Why Do We Still Tell the Same Stories?", "Why Does Every Culture Have a Flood Story?", "Why Do Heroes Always Break the One Rule?", "What Were Monsters Actually For?", "Why Is the Underworld Always Downward?", "What Happens to a Story Nobody Writes Down?", "Why Do So Many Myths End Badly?", "Who Were the Gods Really For?", "Why Does Every Myth Carry a Warning?", "What Did People Believe Before History?"];
var STAGES=["plan","script","narrated","rendered"];
var TUNE={tone:['plain','warm','sombre','wry','urgent'],pace:['slow','measured','brisk'],
          register:['spoken','literary','documentary']};
function clock(s){var m=Math.floor(s/60),r=Math.round(s-m*60);if(r===60){m++;r=0;}return m+':'+(r<10?'0':'')+r;}
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function script(n){for(var i=0;i<D.scripts.length;i++)if(D.scripts[i].name===n)return D.scripts[i];return null;}
function mb(b){return (b/1048576).toFixed(1)+' MB';}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function save(kind,id,val){store[kind][id]=val;store.dirty[kind+':'+id]=true;
  if(DB){DB.doc((kind==='tone'?'episodes/':kind==='pack'?'packages/':'backgrounds/')+id).set(val).catch(function(){});}
  else lsSet('omd:'+kind+':'+id,val); foot();}
function foot(){}
function allEps(){
  return D.episodes.map(function(e){return {id:e.id,title:e.title,stage:e.status==='rendered'?'rendered':'plan',built:true};})
    .concat(store.queue.map(function(q){return {id:q.id,title:q.topic,stage:q.stage||'plan',built:false,at:q.at};}));
}
function epList(){
  var chips=SEEDS.map(function(t){return '<button class="opt" data-seed="'+esc(t)+'">'+esc(t)+'</button>';}).join('');
  var eps=allEps();
  return '<div class="panel"><span class="lbl">New episode</span>'+
    '<div class="row"><input type="text" id="newTitle" placeholder="Episode title\u2026" style="flex:1;min-width:200px">'+
    '<button class="btn" id="createEp">Create</button></div>'+
    '<div class="opts" style="margin-top:10px">'+chips+'</div>'+
    '<p class="rule">Pillar 2: keep the title broad. These are starting points, not final titles.</p></div>'+
    '<h2>Episodes <span class="pill">'+eps.length+'</span></h2>'+
    (eps.length?eps.map(function(e){
      var i=STAGES.indexOf(e.stage);
      return '<button class="epcard" data-ep="'+e.id+'"><span class="t">'+esc(e.title)+
        '<em>'+(e.built?'Cleo \u00b7 af_bella':'awaiting script')+'</em></span>'+
        '<span class="pill'+(i>=3?'':' w')+'">'+e.stage+'</span></button>';}).join('')
     :'<p class="rule">Nothing yet.</p>');
}
function hookHtml(id){
  var hooks=(D.package&&D.package.hooks)||[],tn=store.tone[id]||{};
  var picked=(tn.hook===null||tn.hook===undefined)?((D.defaults||{}).hook):tn.hook;
  var has=picked===0||picked>0;
  if(!hooks.length) return '<div class="panel"><p class="rule">No hook pass yet.</p>'+
    '<button class="btn ghost" data-hooks="'+id+'" data-job="hooks-'+id+'">Run the hook pass</button></div>';
  return '<div class="panel">'+
    '<p class="rule">Pillar 3: the hook is the most important part of the video, so it is '+
    'written separately. Choose one before rendering \u2014 it becomes the opening.</p>'+
    '<ul class="picks">'+hooks.map(function(h,i){
      return '<li><button class="pick" data-pickhook="'+i+'" data-ep="'+id+'" aria-pressed="'+
        (picked===i)+'"><span class="rad"></span><span class="n">'+(i+1)+'</span><span>'+
        esc(h)+'</span></button></li>';
    }).join('')+'</ul>'+
    '<div class="gate">'+
      '<button class="btn" data-render="'+id+'" data-job="render-'+id+'"'+(has?'':' disabled')+
      '>Render this script</button>'+
      '<span class="rule">'+(has?('hook '+(picked+1)+' will open the episode')
                                :'pick a hook to enable rendering')+'</span>'+
      '<button class="btn ghost" data-hooks="'+id+'" data-job="hooks-'+id+'">New hook pass</button>'+
    '</div></div>';
}
function packHtml(id){
  var base=D.package||{}, over=store.pack[id]||{};
  var full=function(v){return Array.isArray(v)?v.length>0:(typeof v==='string'?v.trim().length>0:false);};
  var pk={}; ['titles','tags','description','hooks','thumbText'].forEach(function(k){
    pk[k]=full(over[k])?over[k]:base[k];
  });
  if(!full(pk.titles)&&!full(pk.description)) return '';
  var tn2=store.tone[id]||{};
  var chosen=(tn2.title===null||tn2.title===undefined)?((D.defaults||{}).title):tn2.title;
  return '<h2>Title</h2><div class="panel">'+
    '<p class="rule">Pillar 2: broad beats accurate. Pick one \u2014 it names the file and the thumbnail.</p>'+
    '<ul class="picks">'+(pk.titles||[]).map(function(x,i){
      return '<li><button class="pick" data-picktitle="'+i+'" data-ep="'+id+'" aria-pressed="'+
        (chosen===i)+'"><span class="rad"></span><span class="n">'+(i+1)+'</span><span>'+
        esc(x)+'</span></button></li>';
    }).join('')+'</ul></div>'+
    '<h2>Tags</h2><div class="panel"><div class="pkbox">'+esc((pk.tags||[]).join(', '))+'</div></div>'+
    '<h2>Description</h2><div class="panel"><div class="pkbox">'+esc(pk.description||'')+'</div></div>';
}
function epDetail(id){
  var e=D.episodes.filter(function(x){return x.id===id;})[0];
  if(!e){
    var q=store.queue.filter(function(x){return x.id===id;})[0]||{topic:id};
    return '<button class="back" id="back">\u2190 all episodes</button><h2>'+esc(q.topic)+'</h2>'+
      '<div class="panel"><p class="rule">No script yet. Claude picks this up and runs '+
      'script \u2192 10 hooks \u2192 narration \u2192 render.</p>'+
      '<div class="row" style="margin-top:10px"><button class="btn" data-write="'+esc(id)+'">Write the script now</button>'+
      '<span class="rule" id="epStatus" hidden></span></div><div id="draftOut"></div></div>';
  }
  var sc=script(e.script),t=store.tone[id]||{},cum=0;
  // Pre-picked from the text: a very short paragraph is a landed beat and gets air,
  // a grief passage slows, a question holds. All of it is overridable.
  var dirs=(store.tone[id]||{}).paras||((D.defaults&&D.defaults.paras)||{});
  var PAUSES=['','0.5','1','1.5','2','3'],PACES=['normal','slow','fast'];
  var paras=sc.paras.map(function(p,i){
    var d=p.w/WPM*60,at=cum,dir=dirs[i]||{};
    cum+=d+(parseFloat(dir.pause)||0);
    var L=d>45,marked=!!(dir.pause||(dir.pace&&dir.pace!=='normal'));
    return '<div class="para'+(L?' long':'')+(marked?' marked':'')+'">'+
      '<div class="meta"><b>'+clock(at)+'</b>'+d.toFixed(0)+'s \u00b7 '+p.w+'w'+
      (L?'<span class="flag">runs long</span>':'')+
      '<div class="dir">'+
        '<select data-dir="pace" data-i="'+i+'" data-ep="'+id+'" title="pace for this paragraph">'+
        PACES.map(function(v){return '<option value="'+v+'"'+((dir.pace||'normal')===v?' selected':'')+
          '>'+v+'</option>';}).join('')+'</select>'+
        '<select data-dir="pause" data-i="'+i+'" data-ep="'+id+'" title="silence after this paragraph">'+
        PAUSES.map(function(v){return '<option value="'+v+'"'+((dir.pause||'')===v?' selected':'')+
          '>'+(v?('+'+v+'s'):'no pause')+'</option>';}).join('')+'</select>'+
      '</div></div><p>'+esc(p.t)+'</p></div>';}).join('');

  return '<button class="back" id="back">← all episodes</button><h2>'+esc(e.title)+'</h2>'+
    '<div class="panel">'+
    '<span class="lbl">Notes for the rewrite</span><textarea id="tnote">'+esc(t.note||'')+'</textarea>'+
    '<p class="saveline">'+(t.saved?('last change '+esc(t.saved)):'no changes yet')+'</p></div>'+
    packHtml(id)+'<h2>Hooks — first 15 seconds</h2>'+hookHtml(id)+'<h2>Script — '+sc.words+' words, est. '+clock(sc.words/WPM*60)+'</h2>'+'<div class="script">'+paras+'</div>';
}
function renderEps(){document.getElementById('v-eps').innerHTML=open?epDetail(open):('<h2>Episodes</h2>'+epList());}

function renderRen(){
  var e=D.episodes[0],m=e.master,po=store.pack[e.id]||{},pb=D.package||{};
  var pk={thumbText:(po.thumbText&&po.thumbText.trim())?po.thumbText:pb.thumbText};
  var pkHtml='';
  if(pk){
    pkHtml='<div class="pk"><h3>Thumbnail</h3>'+
      '<div class="thumbwrap" id="thumbWrap"><canvas id="thumb" width="1280" height="720"></canvas>'+
      '<div class="thumbspin">'+ring(0.75,false)+'</div></div>'+
      '<p class="rule">2–3 focus points + text + main subject + contrasting background</p>'+
      '<span class="lbl" style="margin-top:10px">Thumbnail background</span><div class="opts">'+
      D.backgrounds.map(function(b){return '<button class="opt" data-thumbbg="'+b.id+'" aria-pressed="'+
        ((store.thumbBg||(D.episodes[0].locations||[])[0])===b.id)+'">'+b.id+'</button>';}).join('')+'</div>'+
      '<div class="row" style="margin-top:8px"><button class="btn ghost" id="dlThumb">Download thumbnail</button>'+
      '</div></div>';
  }
  document.getElementById('v-ren').innerHTML='<h2>Master</h2><div class="panel">'+
    '<video controls preload="metadata" playsinline src="'+m.preview+'"></video>'+
    '<dl class="spec"><dt>resolution</dt><dd>'+m.w+'×'+m.h+'</dd>'+
    '<dt>duration</dt><dd>'+clock(m.dur)+'</dd><dt>size</dt><dd>'+mb(m.size)+'</dd>'+
    '<dt>file</dt><dd>'+esc(m.file)+'</dd></dl>'+
    '<div class="pop"><button class="btn ghost" id="dlOpen" aria-expanded="false">↓ Download</button>'+
    '<div class="popmenu" id="dlMenu" hidden>'+
      '<div class="grp"><label for="dlQual">Quality</label>'+
      '<select id="dlQual" style="width:100%">'+m.downloads.map(function(d,i){
        return '<option value="'+i+'">'+d.label+' — '+d.note+' — '+mb(d.size)+'</option>';}).join('')+
      '</select></div>'+
      '<div class="grp"><label for="dlCap">or cap the size (MB)</label>'+
      '<input type="text" id="dlCap" inputmode="decimal" placeholder="e.g. 10"></div>'+
      '<button class="btn" id="dlGo" style="width:100%">Download</button>'+
      '<p class="rule" id="dlNote"></p></div></div>'+
    pkHtml+'</div>';
  if(pk) drawThumb(pk);
}
var CLEO=null;
(function(){ if(!D.cleo)return; CLEO=new Image(); CLEO.src=D.cleo; })();
function drawThumb(pk){
  var c=document.getElementById('thumb');if(!c)return;var g=c.getContext('2d');
  var wrap=document.getElementById('thumbWrap');
  if(wrap)wrap.classList.add('busy');
  var bgId=store.thumbBg||(D.episodes[0].locations||[])[0];
  var bgObj=D.backgrounds.filter(function(b){return b.id===bgId;})[0]||D.backgrounds[0];
  var im=new Image();
  im.onload=function(){
    g.drawImage(im,0,0,1280,720);
    var grd=g.createLinearGradient(0,0,1280,0);
    grd.addColorStop(0,'rgba(8,10,14,.88)');grd.addColorStop(.52,'rgba(8,10,14,.22)');grd.addColorStop(1,'rgba(8,10,14,.05)');
    g.fillStyle=grd;g.fillRect(0,0,1280,720);
    // Cleo is on every thumbnail: she is the "main subject" the packaging rule asks for,
    // and the one element that is the same on every video in the channel.
    if(CLEO&&CLEO.complete&&CLEO.naturalWidth){
      var ch=660, cw=CLEO.naturalWidth/CLEO.naturalHeight*ch;
      g.drawImage(CLEO, 1280-cw-40, 720-ch, cw, ch);
    }
    var words=String(pk.thumbText||'').toUpperCase().split(/\s+/).filter(Boolean);
    if(!words.length)return;
    var lines=[],cur='';
    g.font='800 96px Archivo, sans-serif';
    words.forEach(function(w){var t=cur?cur+' '+w:w;
      if(g.measureText(t).width>560&&cur){lines.push(cur);cur=w;}else cur=t;});
    if(cur)lines.push(cur);
    var y=360-((lines.length-1)*104)/2;
    lines.forEach(function(L){
      g.fillStyle='#f5d33a';g.fillRect(56,y-70,g.measureText(L).width+34,96);
      g.fillStyle='#0b0d11';g.fillText(L,73,y);y+=104;});
    if(wrap)setTimeout(function(){wrap.classList.remove('busy');},280);
  };
  im.src=bgObj.img;
}
function renderBgs(){
  var q=(store.bgQuery||'').toLowerCase(), sort=store.bgSort||'screen';
  var list=D.backgrounds.filter(function(b){return !q||b.id.toLowerCase().indexOf(q)>=0;});
  list.sort(function(a,b){
    if(sort==='name')return a.id<b.id?-1:a.id>b.id?1:0;
    if(sort==='recent')return (b.last||0)-(a.last||0);
    return (b.secs||0)-(a.secs||0);
  });
  var cards=list.map(function(b){
    var f=store.bg[b.id]||{},out=!!f.excluded;
    return '<div class="bg'+(out?' out':'')+'">'+
      '<img src="'+b.img+'" alt="'+b.id+'" loading="lazy">'+
      '<button class="x" data-bg="'+b.id+'" aria-pressed="'+out+'" title="'+
        (out?'Use this again':'Do not use again')+'" aria-label="'+
        (out?'Restore '+b.id:'Retire '+b.id)+'">'+(out?'\u21ba':'\u00d7')+'</button>'+
      '<div class="bd"><div class="nm">'+b.id+'<em>'+b.shots+' shots \u00b7 '+clock(b.secs)+'</em></div>'+
      (out?'<div class="why">retired</div>':'')+'</div></div>';
  }).join('');
  document.getElementById('v-bgs').innerHTML=
    '<h2>Backgrounds</h2>'+
    '<div class="bar"><input type="text" id="bgQ" placeholder="Search by name\u2026" value="'+
      esc(store.bgQuery||'')+'">'+
    '<select id="bgSort">'+
      ['screen|by screen time','name|by name','recent|by recent use'].map(function(o){
        var v=o.split('|')[0];
        return '<option value="'+v+'"'+(sort===v?' selected':'')+'>'+o.split('|')[1]+'</option>';}).join('')+
    '</select></div>'+
    (cards?'<div class="bgrid">'+cards+'</div>'
          :'<p class="rule">Nothing matches \u201c'+esc(store.bgQuery||'')+'\u201d.</p>');
  var qi=document.getElementById('bgQ');
  if(qi&&store.bgFocus){qi.focus();qi.setSelectionRange(qi.value.length,qi.value.length);}
}
function renderAll(){renderEps();renderRen();renderBgs();foot();}

var JOBSTEPS={
  script:['queued','brief','drafting','length check','ready'],
  hooks:['queued','script read','ten variations','ready'],
  package:['queued','script read','titles and tags','thumbnail text','ready'],
  render:['queued','narration','mouth envelope','shot plan','frames','muxed']
};
function ring(frac,spinning){
  var C=2*Math.PI*6.2;
  return '<svg class="ring'+(spinning?' spin':'')+'" viewBox="0 0 16 16" aria-hidden="true">'+
    '<circle class="bg" cx="8" cy="8" r="6.2"></circle>'+
    '<circle class="fg" cx="8" cy="8" r="6.2" stroke-dasharray="'+C.toFixed(2)+'" '+
    'stroke-dashoffset="'+(C*(1-frac)).toFixed(2)+'"></circle></svg>';
}
function paintBtn(btn,kind,job){
  if(!btn)return;
  var names=JOBSTEPS[kind]||['queued','working','ready'];
  if(!job||job.state==='done'||job.state==='failed'){
    btn.classList.remove('busy');
    btn.innerHTML=btn.dataset.label||btn.textContent;
    btn.disabled=false; return;
  }
  if(!btn.dataset.label)btn.dataset.label=btn.innerHTML;
  var step=typeof job.step==='number'?job.step:0;
  var frac=Math.min(1,(step+1)/names.length);
  btn.classList.add('busy'); btn.disabled=true;
  btn.innerHTML=ring(frac,true)+esc(names[Math.min(step,names.length-1)]);
}
function startJob(kind,id,btn){
  var key=kind+'-'+id;
  var rec={kind:kind,episode:id,state:'queued',step:0,
           at:new Date().toISOString(),tone:store.tone[id]||{},
           excluded:Object.keys(store.bg).filter(function(k){return store.bg[k].excluded;})};
  paintBtn(btn,kind,rec);
  if(!DB){ setTimeout(function(){paintBtn(btn,kind,null);},1200); return; }
  DB.doc('jobs/'+key).set(rec).catch(function(){});
  if(store.watch[key])return;
  store.watch[key]=true;
  try{
    DB.doc('jobs/'+key).onSnapshot(function(j){
      if(!j)return; store.jobs[key]=j;
      paintBtn(document.querySelector('[data-job="'+key+'"]'),kind,j);
    });
  }catch(e){}
}
function queueJob(kind,id,label){
  var st=document.getElementById('pkStatus')||document.getElementById('epStatus');
  var rec={kind:kind,episode:id,at:new Date().toISOString(),tone:store.tone[id]||{},
           excluded:Object.keys(store.bg).filter(function(k){return store.bg[k].excluded;})};
  if(DB)DB.doc('jobs/'+kind+'-'+id).set(rec).catch(function(){});
  else lsSet('omd:job:'+kind+':'+id,rec);
  if(st)st.textContent=label+' queued \u2014 runs on Gemini, not on your Claude usage.';
}
async function saveFile(src,name){
  try{
    var r=await fetch(src);var b=await r.blob();
    if(DL){await DL.save({filename:name,data:b});}
    else{var u=URL.createObjectURL(b);var a=document.createElement('a');a.href=u;a.download=name;a.click();
         setTimeout(function(){URL.revokeObjectURL(u);},4000);}
  }catch(e){}
}
document.addEventListener('click',async function(ev){
  var t=ev.target,el;
  if((el=t.closest&&t.closest('.tab'))){Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(o){
    var on=o===el;o.setAttribute('aria-selected',String(on));document.getElementById('v-'+o.dataset.v).hidden=!on;});return;}
  if((el=t.closest&&t.closest('.epcard'))&&el.dataset.ep){open=el.dataset.ep;renderEps();return;}
  if(t.id==='back'){open=null;renderEps();return;}
  if((el=t.closest&&t.closest('[data-seed]'))){
    var inp=document.getElementById('newTitle');
    if(inp){inp.value=el.dataset.seed;inp.focus();}
    return;}
  if(t.id==='createEp'){
    var ti=document.getElementById('newTitle');
    var title=ti?ti.value.trim():'';
    if(!title)return;
    var nid='q'+Date.now();
    store.queue.push({id:nid,topic:title,stage:'plan',at:new Date().toISOString()});
    if(DB)DB.doc('queue/'+nid).set({topic:title,stage:'plan',at:new Date().toISOString()}).catch(function(){});
    else lsSet('omd:queue',store.queue);
    if(ti)ti.value='';
    renderEps();
    return;}
  if(t.id==='genNew'){document.getElementById('genPanel').hidden=false;return;}
  if(t.id==='genCancel'){document.getElementById('genPanel').hidden=true;return;}
  if(t.id==='genGo'){
    var topic=document.getElementById('genTopic').value.trim();if(!topic)return;
    var o=document.getElementById('genOut');o.innerHTML='<p class="rule">Queuing…</p>';
    store.queue.push({topic:topic,at:new Date().toLocaleString()});
    if(DB)DB.doc('queue/'+Date.now()).set({topic:topic,at:new Date().toISOString()}).catch(function(){});
    else lsSet('omd:queue',store.queue);
    o.innerHTML='<p class="rule">Queued. Claude picks this up and runs script → hooks → narration → render.</p>';
    renderEps();return;}
  if((el=t.closest&&t.closest('.opt'))&&el.dataset.tune){var cur=store.tone[open]||{};var k=el.dataset.tune;
    cur[k]=(cur[k]===el.dataset.val)?null:el.dataset.val;cur.saved=new Date().toLocaleString();
    save('tone',open,cur);renderEps();return;}
  if((el=t.closest&&t.closest('.x'))&&el.dataset.bg){var id=el.dataset.bg,f=store.bg[id]||{};
    f.excluded=!f.excluded;f.saved=new Date().toISOString();save('bg',id,f);renderBgs();return;}
  if(t.id==='dlOpen'){var mnu=document.getElementById('dlMenu');
    mnu.hidden=!mnu.hidden;t.setAttribute('aria-expanded',String(!mnu.hidden));return;}
  if(t.id==='dlGo'){
    var m2=D.episodes[0].master,cap=parseFloat((document.getElementById('dlCap')||{}).value),
        note=document.getElementById('dlNote'),pick;
    if(cap>0){
      var under=m2.downloads.filter(function(d){return d.size/1048576<=cap;})
                            .sort(function(a,b){return b.size-a.size;});
      if(!under.length){ if(note)note.textContent='Nothing that small — the smallest is '+
        mb(Math.min.apply(null,m2.downloads.map(function(d){return d.size;})))+'.'; return; }
      pick=under[0];
    } else { pick=m2.downloads[parseInt(document.getElementById('dlQual').value,10)||0]; }
    if(note)note.textContent='Saving '+pick.label+' · '+mb(pick.size);
    saveFile(pick.src,D.episodes[0].id+'-'+pick.label.toLowerCase()+'.mp4');return;}
  if(t.id==='approve'){startJob('package',D.episodes[0].id,t);return;}
  if((el=t.closest&&t.closest('[data-picktitle]'))){
    var tid=el.dataset.ep,tc=store.tone[tid]||{};
    var ti2=parseInt(el.dataset.picktitle,10);
    tc.title=(tc.title===ti2)?null:ti2;
    tc.saved=new Date().toLocaleString();
    save('tone',tid,tc); renderEps(); return;}
  if((el=t.closest&&t.closest('[data-pickhook]'))){
    var hid=el.dataset.ep,cur=store.tone[hid]||{};
    var idx=parseInt(el.dataset.pickhook,10);
    cur.hook=(cur.hook===idx)?null:idx;
    cur.saved=new Date().toLocaleString();
    save('tone',hid,cur); renderEps(); return;}
  if((el=t.closest&&t.closest('[data-render]'))){startJob('render',el.dataset.render,el);return;}
  if((el=t.closest&&t.closest('[data-hooks]'))){startJob('hooks',el.dataset.hooks,el);return;}
  if((el=t.closest&&t.closest('[data-thumbbg]'))){store.thumbBg=el.dataset.thumbbg;lsSet('omd:thumbBg',store.thumbBg);renderRen();return;}
  if(t.id==='dlThumb'){var c=document.getElementById('thumb');if(!c)return;
    c.toBlob(async function(b){if(DL)await DL.save({filename:'orpheus-thumbnail.png',data:b});
      else{var u=URL.createObjectURL(b);var a=document.createElement('a');a.href=u;a.download='orpheus-thumbnail.png';a.click();}},'image/png');return;}
});
document.addEventListener('input',function(ev){
  if(ev.target.id==='bgQ'){store.bgQuery=ev.target.value;store.bgFocus=true;renderBgs();store.bgFocus=false;}
});
document.addEventListener('change',function(ev){
  var d=ev.target.getAttribute&&ev.target.getAttribute('data-dir');
  if(d){
    var ep=ev.target.dataset.ep,i=ev.target.dataset.i,cur=store.tone[ep]||{};
    cur.paras=cur.paras||{}; cur.paras[i]=cur.paras[i]||{};
    cur.paras[i][d]=ev.target.value;
    if(d==='pace'&&ev.target.value==='normal')delete cur.paras[i].pace;
    if(d==='pause'&&!ev.target.value)delete cur.paras[i].pause;
    cur.saved=new Date().toLocaleString();
    save('tone',ep,cur); renderEps(); return;
  }
  if(ev.target.id==='bgSort'){store.bgSort=ev.target.value;lsSet('omd:bgSort',store.bgSort);renderBgs();return;}
  if(ev.target.id==='tnote'&&open){var cur=store.tone[open]||{};cur.note=ev.target.value;
    cur.saved=new Date().toLocaleString();save('tone',open,cur);}
});
D.episodes.forEach(function(e){store.tone[e.id]=lsGet('omd:tone:'+e.id,{});store.pack[e.id]=lsGet('omd:pack:'+e.id,null);});
D.backgrounds.forEach(function(b){store.bg[b.id]=lsGet('omd:bg:'+b.id,{});});
store.queue=lsGet('omd:queue',[]);store.thumbBg=lsGet('omd:thumbBg',null);store.bgSort=lsGet('omd:bgSort','screen');store.bgQuery='';
renderAll();
if(window.claude&&window.claude.use){
  window.claude.use('db').then(function(db){if(!db)return;DB=db;
    var jobs=D.episodes.map(function(e){return db.doc('episodes/'+e.id).get().then(function(d){if(d&&!store.dirty['tone:'+e.id])store.tone[e.id]=d;}).catch(function(){});})
      .concat(D.episodes.map(function(e){return db.doc('packages/'+e.id).get().then(function(d){if(d&&!store.dirty['pack:'+e.id])store.pack[e.id]=d;}).catch(function(){});}))
      .concat(D.backgrounds.map(function(b){return db.doc('backgrounds/'+b.id).get().then(function(d){if(d&&!store.dirty['bg:'+b.id])store.bg[b.id]=d;}).catch(function(){});}));
    Promise.all(jobs).then(renderAll);}).catch(function(){});
  window.claude.use('downloads').then(function(d){DL=d;}).catch(function(){});
}
})();
</script>
